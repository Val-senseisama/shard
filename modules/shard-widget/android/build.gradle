apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.xavitech.shardwidget'
version = '1.0.0'

android {
  namespace 'com.xavitech.shardwidget'

  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    targetSdk safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

// Read the root project's SDK versions when present, so this module can never
// drift from the app it ships inside.
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  // The kotlin-android plugin contributes the stdlib at the version the root
  // project already resolved, so declaring it here only risks a version clash.
  //
  // Deliberately no Glance / Compose either. The widget is built with RemoteViews,
  // which needs no extra dependencies and no Kotlin compiler-extension version
  // pinning — dragging Compose into a React Native app is a real source of build
  // breakage.
}
