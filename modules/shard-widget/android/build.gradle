apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.xavitech.shardwidget'
version = '1.0.0'

android {
  namespace 'com.xavitech.shardwidget'

  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    targetSdk safeExtGet('targetSdkVersion', 35)
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  packaging {
    jniLibs {
      // Keeps the instrumentation APK installable. It inherits every dependency
      // of the main source set, so it was packaging react-android's and
      // expo-modules-core's .so files for four ABIs — 180MB for a test that only
      // inflates views and never crosses into native code. This module ships no
      // native libraries of its own, so nothing here affects the app's APK.
      excludes += ['**/*.so']
    }
  }
}

// Read the root project's SDK versions when present, so this module can never
// drift from the app it ships inside.
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')

  // Instrumentation only — none of this reaches the app APK. It exists to run
  // ShardWidgetRenderTest, which inflates the RemoteViews tree the way a
  // launcher would; see the note on ShardWidgetProvider.buildViews.
  androidTestImplementation 'androidx.test:core:1.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'junit:junit:4.13.2'
  // The kotlin-android plugin contributes the stdlib at the version the root
  // project already resolved, so declaring it here only risks a version clash.
  //
  // Deliberately no Glance / Compose either. The widget is built with RemoteViews,
  // which needs no extra dependencies and no Kotlin compiler-extension version
  // pinning — dragging Compose into a React Native app is a real source of build
  // breakage.
}
