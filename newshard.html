<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              tertiary: '#ff97b5',
              'primary-dim': '#8455ef',
              surface: '#0e0e0e',
              'on-error-container': '#ffb2b9',
              'surface-container-low': '#131313',
              'secondary-container': '#5e2c91',
              'on-background': '#ffffff',
              'error-dim': '#d73357',
              'inverse-primary': '#6e3bd7',
              'surface-container-high': '#20201f',
              'on-tertiary': '#6a0934',
              'tertiary-fixed-dim': '#f67ca3',
              'on-secondary': '#390068',
              'inverse-surface': '#fcf9f8',
              'surface-container-lowest': '#000000',
              'on-tertiary-container': '#59002a',
              'on-secondary-fixed-variant': '#69379c',
              'tertiary-dim': '#f0779d',
              secondary: '#c08cf7',
              'inverse-on-surface': '#565555',
              outline: '#767575',
              'secondary-fixed-dim': '#dab4ff',
              'on-error': '#490013',
              'on-tertiary-fixed': '#380018',
              'on-primary-fixed-variant': '#370086',
              'surface-container-highest': '#262626',
              error: '#ff6e84',
              primary: '#ba9eff',
              background: '#0e0e0e',
              'primary-fixed-dim': '#a27cff',
              'on-secondary-container': '#e3c4ff',
              'on-primary': '#39008c',
              'on-surface-variant': '#adaaaa',
              'surface-dim': '#0e0e0e',
              'secondary-dim': '#bb87f1',
              'error-container': '#a70138',
              'primary-container': '#ae8dff',
              'primary-fixed': '#ae8dff',
              'on-primary-container': '#2b006e',
              'surface-container': '#1a1a1a',
              'on-tertiary-fixed-variant': '#701039',
              'surface-bright': '#2c2c2c',
              'on-secondary-fixed': '#4b147d',
              'tertiary-fixed': '#ff8eb0',
              'secondary-fixed': '#e4c6ff',
              'outline-variant': '#484847',
              'surface-tint': '#ba9eff',
              'tertiary-container': '#fd81a8',
              'on-primary-fixed': '#000000',
              'on-surface': '#ffffff',
              'surface-variant': '#262626',
            },
            fontFamily: {
              headline: ['Plus Jakarta Sans'],
              body: ['Inter'],
              label: ['Inter'],
            },
            borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .glass-card {
        background: rgba(26, 26, 26, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #484847;
        border-radius: 10px;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface font-body selection:text-on-primary-fixed min-h-screen pb-32 selection:bg-primary">
    <!-- TopAppBar -->
    <header
      class="fixed top-0 z-50 w-full bg-[#0e0e0e]/80 shadow-[0px_0px_32px_rgba(139,92,246,0.06)] backdrop-blur-xl">
      <div class="flex w-full items-center justify-between px-6 py-4">
        <div class="flex items-center gap-4">
          <button class="text-[#8B5CF6] duration-200 active:scale-95">
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
          </button>
          <h1 class="font-['Plus_Jakarta_Sans'] text-2xl font-bold tracking-tight text-[#8B5CF6]">
            Shard
          </h1>
        </div>
        <div class="text-xl font-black italic tracking-tighter text-[#8B5CF6]">SHARD</div>
      </div>
      <div class="absolute bottom-0 h-[1px] w-full bg-[#131313]"></div>
    </header>
    <main class="mx-auto max-w-lg px-6 pt-24">
      <!-- Segmented Control -->
      <div class="bg-surface-container-low mb-8 flex rounded-2xl p-1">
        <button
          class="bg-surface-bright flex-1 rounded-xl py-3 text-sm font-semibold text-primary shadow-[0_0_15px_rgba(139,92,246,0.1)] transition-all">
          AI-Assisted
        </button>
        <button
          class="text-on-surface-variant hover:text-on-surface flex-1 py-3 text-sm font-semibold transition-colors">
          Manual
        </button>
      </div>
      <!-- AI Assistant Card -->
      <div
        class="glass-card border-outline-variant/10 relative overflow-hidden rounded-[2rem] border p-8 shadow-[0px_0px_40px_rgba(139,92,246,0.04)]">
        <!-- Decorative Glow -->
        <div
          class="absolute -right-24 -top-24 h-48 w-48 rounded-full bg-primary/10 blur-[80px]"></div>
        <label class="mb-6 block">
          <span
            class="text-on-surface-variant mb-4 block text-xs font-bold uppercase tracking-widest"
            >What do you want to achieve?</span
          >
          <textarea
            class="border-outline-variant font-headline placeholder:text-outline/40 custom-scrollbar w-full resize-none border-b-2 bg-transparent py-4 text-xl font-semibold outline-none transition-all duration-300 focus:border-primary"
            placeholder="e.g., Learn React Native and build a mobile app"
            rows="3"></textarea>
        </label>
        <!-- Media & Date Actions -->
        <div class="mt-8 grid grid-cols-2 gap-4">
          <button
            class="bg-surface-container-high border-outline-variant/10 hover:bg-surface-bright group flex flex-col items-center justify-center gap-3 rounded-2xl border p-6 transition-colors">
            <span
              class="material-symbols-outlined text-primary duration-200 group-hover:scale-110"
              data-icon="add_a_photo"
              >add_a_photo</span
            >
            <span class="text-on-surface-variant text-xs font-medium">Add an image</span>
          </button>
          <div
            class="bg-surface-container-high border-outline-variant/10 flex flex-col items-start justify-center gap-1 rounded-2xl border p-6">
            <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-widest"
              >Deadline</span
            >
            <div class="text-on-surface flex items-center gap-2">
              <span class="material-symbols-outlined text-sm" data-icon="calendar_today"
                >calendar_today</span
              >
              <span class="text-sm font-semibold">Set deadline</span>
            </div>
          </div>
        </div>
        <!-- Privacy Toggles -->
        <div class="mt-8 space-y-4">
          <div class="bg-surface-container-low flex items-center justify-between rounded-xl p-4">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant" data-icon="lock"
                >lock</span
              >
              <span class="text-sm font-medium">Private Quest</span>
            </div>
            <div
              class="bg-surface-container-highest relative h-5 w-10 cursor-pointer rounded-full p-1">
              <div class="bg-outline h-3 w-3 rounded-full"></div>
            </div>
          </div>
          <div class="bg-surface-container-low flex items-center justify-between rounded-xl p-4">
            <div class="flex items-center gap-3">
              <span
                class="material-symbols-outlined text-on-surface-variant"
                data-icon="visibility_off"
                >visibility_off</span
              >
              <span class="text-sm font-medium">Anonymous Mode</span>
            </div>
            <div class="relative h-5 w-10 cursor-pointer rounded-full bg-primary/20 p-1">
              <div
                class="ml-auto h-3 w-3 rounded-full bg-primary shadow-[0_0_8px_rgba(186,158,255,0.6)]"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Hint Section -->
      <div
        class="mt-8 flex items-start gap-3 rounded-2xl border border-primary/10 bg-primary/5 p-4">
        <span class="material-symbols-outlined text-xl text-primary" data-icon="auto_awesome"
          >auto_awesome</span
        >
        <p class="text-on-surface-variant text-xs leading-relaxed">
          Our AI will break down your goal into manageable steps, suggest resources, and set up a
          personalized timeline.
        </p>
      </div>
      <!-- Primary CTA -->
      <div class="mt-12">
        <button
          class="text-on-primary-fixed font-headline flex w-full items-center justify-center gap-3 rounded-2xl bg-gradient-to-br from-[#ba9eff] to-[#8455ef] py-5 text-lg font-extrabold shadow-[0_0_40px_rgba(139,92,246,0.3)] duration-200 active:scale-95">
          <span
            class="material-symbols-outlined"
            data-icon="bolt"
            data-weight="fill"
            style="font-variation-settings: 'FILL' 1"
            >bolt</span
          >
          Generate Quest with AI
        </button>
      </div>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 z-50 w-full rounded-t-[2rem] bg-[#1a1a1a]/90 shadow-[0px_-8px_40px_rgba(139,92,246,0.12)] backdrop-blur-3xl">
      <div class="flex w-full items-center justify-around px-4 pb-6 pt-2">
        <!-- Home -->
        <a
          class="flex flex-col items-center justify-center p-3 text-[#adaaaa] transition-all duration-300 ease-out hover:text-[#ba9eff] active:scale-90"
          href="#">
          <span class="material-symbols-outlined mb-1" data-icon="home">home</span>
          <span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wide">Home</span>
        </a>
        <!-- Challenges - Active logic: Creation is part of growth/challenges -->
        <a
          class="flex flex-col items-center justify-center rounded-2xl bg-gradient-to-br from-[#ba9eff] to-[#8455ef] p-3 text-black shadow-[0_0_15px_rgba(139,92,246,0.4)] duration-300 ease-out active:scale-90"
          href="#">
          <span class="material-symbols-outlined mb-1" data-icon="emoji_events">emoji_events</span>
          <span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wide"
            >Challenges</span
          >
        </a>
        <!-- Friends -->
        <a
          class="flex flex-col items-center justify-center p-3 text-[#adaaaa] transition-all duration-300 ease-out hover:text-[#ba9eff] active:scale-90"
          href="#">
          <span class="material-symbols-outlined mb-1" data-icon="group">group</span>
          <span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wide"
            >Friends</span
          >
        </a>
        <!-- Profile -->
        <a
          class="flex flex-col items-center justify-center p-3 text-[#adaaaa] transition-all duration-300 ease-out hover:text-[#ba9eff] active:scale-90"
          href="#">
          <span class="material-symbols-outlined mb-1" data-icon="person">person</span>
          <span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wide"
            >Profile</span
          >
        </a>
      </div>
    </nav>
  </body>
</html>
